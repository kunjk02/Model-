<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Device Information</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 35px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 1.5rem; font-weight: 600; }
        .header p { font-size: 0.85rem; opacity: 0.6; margin-top: 6px; }
        .info-grid { display: flex; flex-direction: column; gap: 12px; }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; }
        .value { font-size: 0.95rem; font-weight: 500; text-align: right; word-break: break-all; max-width: 55%; }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .charging-yes { background: rgba(46, 213, 115, 0.2); color: #2ed573; }
        .charging-no { background: rgba(255, 165, 0, 0.2); color: #ffa502; }
        .loading { text-align: center; padding: 30px 0; }
        .spinner {
            width: 40px; height: 40px; margin: 0 auto 15px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { text-align: center; margin-top: 20px; font-size: 0.7rem; opacity: 0.35; }
        .value.ip { font-family: 'Courier New', monospace; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔍 Device Scanner</h1>
        <p>Collecting system information...</p>
    </div>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Gathering device data...</span>
    </div>
    <div class="info-grid" id="infoGrid" style="display:none;">
        <div class="info-row"><span class="label">Device Model</span><span class="value" id="deviceModel">—</span></div>
        <div class="info-row"><span class="label">Operating System</span><span class="value" id="os">—</span></div>
        <div class="info-row"><span class="label">Browser</span><span class="value" id="browser">—</span></div>
        <div class="info-row"><span class="label">Screen</span><span class="value" id="screen">—</span></div>
        <div class="info-row"><span class="label">Battery</span><span class="value" id="batteryLevel">—</span></div>
        <div class="info-row"><span class="label">Charging</span><span class="value" id="chargingStatus">—</span></div>
        <div class="info-row"><span class="label">RAM (approx)</span><span class="value" id="ram">—</span></div>
        <div class="info-row"><span class="label">Storage (approx)</span><span class="value" id="storage">—</span></div>
        <div class="info-row"><span class="label">Language</span><span class="value" id="language">—</span></div>
        <div class="info-row"><span class="label">Time Zone</span><span class="value" id="timezone">—</span></div>
        <div class="info-row"><span class="label">IP Address</span><span class="value ip" id="ipAddress">—</span></div>
        <div class="info-row"><span class="label">ISP / Location</span><span class="value" id="isp">—</span></div>
        <div class="info-row"><span class="label">Phone Number</span><span class="value" id="phoneNumber">—</span></div>
    </div>
    <div class="footer">Authorized Security Assessment</div>
</div>

<script>
    // Collect all device info and send to Python backend
    async function getBatteryInfo() {
        try {
            const b = await navigator.getBattery();
            return { level: Math.round(b.level * 100), charging: b.charging };
        } catch(e) { return { level: -1, charging: false }; }
    }

    function getRAMInfo() {
        if (navigator.deviceMemory) return navigator.deviceMemory;
        if (/Android/.test(navigator.userAgent)) return -2;
        if (/iPhone/.test(navigator.userAgent)) return -3;
        return -1;
    }

    async function getStorageInfo() {
        try {
            if (navigator.storage?.estimate) {
                const e = await navigator.storage.estimate();
                return { quota: Math.round(e.quota / (1024**3)), usage: Math.round(e.usage / (1024**3)) };
            }
        } catch(e) {}
        return null;
    }

    function detectDeviceModel() {
        const ua = navigator.userAgent;
        const m = ua.match(/iPhone\s([\d,\s]+)/i) || ua.match(/iPad[\s\S]*?(\d+)/i) ||
                 ua.match(/SM-[A-Z0-9]+/i) || ua.match(/Pixel\s[\d]+/i) ||
                 ua.match(/(Galaxy\s[A-Z0-9]+)/i) || ua.match(/(Redmi|Mi|POCO)\s[A-Z0-9]+/i) ||
                 ua.match(/(OnePlus\s[A-Z0-9]+)/i) || ua.match(/(Huawei|Honor)[^\s]*\s[A-Z0-9-]+/i) ||
                 ua.match(/Xiaomi[\s\/][A-Z0-9]+/i) || [];
        return m ? m[0].trim() : 'Generic Device';
    }

    function detectOS() {
        const u = navigator.userAgent;
        if (/Windows/.test(u)) return 'Windows';
        if (/Mac OS X/.test(u)) return 'macOS';
        if (/Android/.test(u)) return 'Android';
        if (/iPhone|iPad|iPod/.test(u)) return 'iOS';
        if (/Linux/.test(u)) return 'Linux';
        return 'Unknown';
    }

    async function sendData() {
        const battery = await getBatteryInfo();
        const storage = await getStorageInfo();

        const data = {
            device_model: detectDeviceModel(),
            os: detectOS(),
            browser: (() => {
                const u = navigator.userAgent;
                if (/Edg\//.test(u)) return 'Edge';
                if (/Chrome/.test(u)) return 'Chrome';
                if (/Firefox/.test(u)) return 'Firefox';
                if (/Safari/.test(u)) return 'Safari';
                return 'Unknown';
            })(),
            screen: `${screen.width}×${screen.height}`,
            battery_level: battery.level,
            charging: battery.charging,
            ram_gb: getRAMInfo(),
            storage_used_gb: storage?.usage ?? -1,
            storage_total_gb: storage?.quota ?? -1,
            language: navigator.language || 'Unknown',
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
            phone_type: /iPhone|Android/.test(navigator.userAgent) ? 'mobile' : 'desktop',
            user_agent: navigator.userAgent.substring(0, 300)
        };

        try {
            const resp = await fetch('/api/device-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await resp.json();

            // Update UI
            document.getElementById('loading').style.display = 'none';
            document.getElementById('infoGrid').style.display = 'flex';

            document.getElementById('deviceModel').textContent = data.device_model;
            document.getElementById('os').textContent = data.os;
            document.getElementById('browser').textContent = data.browser;
            document.getElementById('screen').textContent = data.screen;
            document.getElementById('batteryLevel').textContent = data.battery_level >= 0 ? data.battery_level + '%' : 'N/A';
            document.getElementById('chargingStatus').innerHTML =
                `<span class="status-badge ${data.charging ? 'charging-yes' : 'charging-no'}">${data.charging ? 'Yes ⚡' : 'No'}</span>`;
            document.getElementById('ram').textContent = data.ram_gb > 0 ? data.ram_gb + ' GB' : data.ram_gb === -2 ? '4-8 GB (est)' : 'N/A';
            document.getElementById('storage').textContent = data.storage_total_gb > 0 ? `${data.storage_used_gb} GB / ${data.storage_total_gb} GB` : 'N/A';
            document.getElementById('language').textContent = data.language;
            document.getElementById('timezone').textContent = data.timezone;
            document.getElementById('ipAddress').textContent = result.ip || 'Unknown';
            document.getElementById('isp').textContent = result.isp || 'Unknown';
            document.getElementById('phoneNumber').textContent = data.phone_type === 'mobile' ? 'Mobile (SIM detected)' : 'Desktop/Tablet';
        } catch(e) {
            console.error('Failed to send data:', e);
        }
    }

    sendData();
</script>
</body>
</html>
